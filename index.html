<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KMITL ESP32 Pager Web Page</title>

    <!-- Bootstrap & FontAwesome Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- ไฟล์ CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-kmitl mb-4">  
        <div class="container py-1">
            <span class="navbar-brand mb-0 h1 fw-bold text-white d-flex align-items-center gap-2">
                <i class="fa-solid fa-pager fs-4"></i> KMITL ESP32 PAGER WEB PAGE
            </span>
        </div>
    </nav>

    <div class="container" style="max-width: 800px;">
        
        <!-- ฟอร์มส่งข้อความ -->
        <div class="card card-custom p-4 mb-4">
            <h5 class="fw-bold mb-3 text-dark d-flex align-items-center gap-2">
                <i class="fa-regular fa-paper-plane text-warning"></i> ส่งข้อความเข้าเครื่อง Pager
            </h5>
            
            <form id="pagerForm">
                <!-- 1.ข้อความ (จำกัดMax 80)-->
                <div class="mb-3">
                    <label class="form-label fw-semibold">ข้อความที่ต้องการส่ง:</label>
                    <textarea id="messageInput" name="message" class="form-control" rows="3" placeholder="พิมพ์ข้อความที่ต้องการส่งออกอากาศ..." maxlength="80" required></textarea>
                    <div id="charCount" class="text-end text-muted small mt-1">0 / 80 ตัวอักษร</div>
                </div>

                <div class="row g-3 mb-3">
                    <!-- 2. รูปแบบการส่ง -->
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">เลือกผู้รับ:</label>
                        
                        <div class="custom-select-container" id="sendModeDropdown">
                            <button type="button" class="custom-select-trigger d-flex justify-content-between align-items-center" id="sendModeToggle">
                                <span id="sendModeLabel">ส่งเฉพาะรายบุคคล (1:1)</span>
                                <i id="sendModeChevron" class="fa-solid fa-chevron-down text-muted small chevron-icon"></i>
                            </button>
                            <div class="custom-select-menu" id="sendModeMenu">
                                <div class="custom-option selected" data-value="1_TO_1">ส่งเฉพาะรายบุคคล (1:1)</div>
                                <div class="custom-option" data-value="1_TO_SOME">ส่งหลายคน (1:N)</div>
                                <div class="custom-option" data-value="1_TO_ALL">ส่งหาทุกคน (1:ALL)</div>
                            </div>
                            <input type="hidden" id="sendModeSelect" name="send_mode" value="1_TO_1" required>
                        </div>

                    </div>

                    <!-- 3. รหัสเครื่องปลายทาง -->
                    <div id="targetContainer" class="col-md-6 animated-box">
                        <label class="form-label fw-semibold">เลือกเครื่องปลายทาง:</label>
                        
                        <!-- 3.1 Dropdown เลือกเครื่องเดียว (1:1) -->
                        <div id="selectbox" class="selectbox">
                            
                            <div class="custom-select-container" id="targetIdDropdown">
                                <button type="button" class="custom-select-trigger d-flex justify-content-between align-items-center" id="targetIdToggle">
                                    <span id="targetIdLabel">เครื่องที่ 1 (PAG-01)</span>
                                    <i id="targetIdChevron" class="fa-solid fa-chevron-down text-muted small chevron-icon"></i>
                                </button>
                                <div class="custom-select-menu" id="targetIdMenu">
                                    <div class="custom-option selected" data-value="001">เครื่องที่ 1 (PAG-01)</div>
                                    <div class="custom-option" data-value="002">เครื่องที่ 2 (PAG-02)</div>
                                    <div class="custom-option" data-value="003">เครื่องที่ 3 (PAG-03)</div>
                                    <div class="custom-option" data-value="OTHER">อื่นๆ (ระบุเอง)</div>
                                </div>
                                <input type="hidden" id="targetIdSelect" name="target_id" value="001">
                            </div>

                        </div>

                        <!-- 3.2 Checkbox Dropdown เลือกหลายเครื่อง (1:N / SOME) -->
                        <div class="checkboxDropdown" id="CheckBoxDropdown">
                            <button type="button" class="checkboxDropdownButton d-flex justify-content-between align-items-center" id="toggleDropdown">
                                <div id="selectedBadgesContainer" class="d-flex flex-wrap gap-1 align-items-center me-2">
                                    <span id="dropdownLabelText" class="text-muted small">-- คลิกเพื่อเลือกเครื่อง --</span>
                                </div>
                                <i id="chevronIcon" class="fa-solid fa-chevron-down text-muted small chevron-icon"></i>
                            </button>
                            
                            <div class="checkbox-dropdown-menu" id="checkboxDropdownMenu">
                                <div class="d-flex justify-content-between pb-2 mb-2 border-bottom px-2">
                                    <button type="button" id="selectAllBtn" class="btn btn-link btn-sm p-0 text-decoration-none text-warning fw-semibold small">เลือกทั้งหมด</button>
                                    <button type="button" id="clearAllBtn" class="btn btn-link btn-sm p-0 text-decoration-none text-muted small">ล้างค่า</button>
                                </div>
                                <label class="checkbox-item">
                                    <input type="checkbox" class="target-checkbox" name="target_id_some" value="001">
                                    <span>PAG-01</span>
                                </label>
                                <label class="checkbox-item">
                                    <input type="checkbox" class="target-checkbox" name="target_id_some" value="002">
                                    <span>PAG-02</span>
                                </label>
                                <label class="checkbox-item">
                                    <input type="checkbox" class="target-checkbox" name="target_id_some" value="003">
                                    <span>PAG-03</span>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- ช่องพิมพ์ระบุเอง -->
                <div id="customTargetContainer" class="mb-3 animated-box hidden">
                    <label class="form-label fw-semibold text-primary">ระบุรหัสเครื่องเอง:</label>
                    <input type="text" id="customTargetInput" name="custom_target_id" class="form-control" placeholder="พิมพ์รหัส เช่น PAG-99">
                </div>

                <!-- ปุ่มส่งข้อความ -->
                <button type="submit" id="submitBtn" class="btn btn-kmitl w-100 fs-6 mt-2">
                    <i class="fa-solid fa-satellite-dish me-2"></i> ส่งข้อความ
                </button>
            </form>
        </div>

    </div>
<!---------------------------------------- ส่วนที่เพิ่มใหม่ ---------------------------------------->
    <!-- ไฟล์ JavaScript: โหลด MQTT ตรงๆ แทนการโหลดผ่าน JS -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script src="api.js"></script>
    <script src="script.js"></script>
<!---------------------------------------- จบส่วนที่เพิ่มใหม่ ---------------------------------------->
</body>
</html>
